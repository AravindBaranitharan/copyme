name = "copyme-relay"
main = "src/index.ts"
compatibility_date = "2026-01-15"

# Keep the workers.dev address alive alongside the custom domain. Enabling a
# route otherwise switches it off, which strands any client still holding the
# older URL.
workers_dev = true

# Serve the relay from your own subdomain. Wrangler creates the DNS record and
# the certificate on deploy, provided the zone's nameservers point at Cloudflare.
# Keep it one level deep — free Universal SSL covers *.example.in but not
# *.*.example.in.
[[routes]]
pattern = "copyme-relay.aravindbaranitharan.in"
custom_domain = true

[vars]
# How long an entry lives before the relay drops it, in seconds.
# 900 (15 min) is the safe default; 3600 trades some exposure for convenience.
ENTRY_TTL_SECONDS = "3600"
MAX_ENTRIES_PER_CHANNEL = "50"
# Ciphertext is base64, so this is roughly 3 MB of text — about 60,000 lines
# of code. SQLite-backed Durable Objects hold values this size comfortably;
# verified by pushing and reading back multi-megabyte entries.
MAX_ENTRY_BYTES = "4000000"
MAX_WRITES_PER_MINUTE = "120"

[[durable_objects.bindings]]
name = "CHANNEL"
class_name = "ChannelRoom"

# SQLite-backed Durable Objects are what the free plan supports.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChannelRoom"]
