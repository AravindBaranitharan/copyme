<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CopyMe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<canvas id="lattice" aria-hidden="true"></canvas>

<div class="shell">
  <header>
    <span class="brand">
      <svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <rect x="2.5" y="5.5" width="10" height="12" rx="1.5" stroke-width="1.8"/>
        <rect x="7.5" y="2.5" width="10" height="12" rx="1.5" fill="none" stroke-width="1.8"/>
      </svg>
      CopyMe
    </span>

    <span class="status" id="status" hidden><i class="dot"></i><span id="statusText"></span></span>

    <button class="tool" id="pulseBtn" title="Send a shockwave through the lattice">
      <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1m-8.6 8.6-2.1 2.1"/>
      </svg>
      <span>Pulse</span>
    </button>

    <button class="tool" id="freezeBtn" title="Pause the animation">
      <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" id="freezeIcon">
        <path d="M7 4v16M17 4v16"/>
      </svg>
      <span id="freezeLabel">Freeze</span>
    </button>

    <button class="tool" id="leaveBtn" hidden><span>Leave</span></button>
  </header>

  <main>
    <p class="error" id="error" hidden></p>

    <section class="panel" id="setup">
      <h1 class="wordmark">COPY<span>ME</span></h1>
      <p class="tagline">One id. Two machines. Encrypted between them.</p>

      <span class="label">Channel ID</span>
      <input class="input" id="key" placeholder="shared secret" autocomplete="off" spellcheck="false">
      <div class="pair">
        <button class="btn solid" id="createBtn"><span>Create</span></button>
        <button class="btn" id="joinBtn"><span>Join</span></button>
      </div>
    </section>

    <section class="panel" id="station" hidden>
      <span class="label">Send</span>
      <textarea id="draft" placeholder="text to send" spellcheck="false"></textarea>
      <button class="btn solid wide" id="sendBtn"><span>Send</span></button>

      <div class="split">
        <button class="btn" id="receiveBtn"><span>Refresh</span></button>
        <button class="btn" id="clearBtn"><span>Clear</span></button>
      </div>

      <div class="history" id="history"></div>
    </section>
  </main>
</div>

<div class="toast" id="toast"></div>
<script type="module" src="app.js"></script>
</body>
</html>
