<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CopyMe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <span class="brand">
    <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <rect x="2.5" y="5.5" width="10" height="12" rx="2" stroke="#0F4C81" stroke-width="1.6"/>
      <rect x="7.5" y="2.5" width="10" height="12" rx="2" fill="#F4F6F3" stroke="#0F4C81" stroke-width="1.6"/>
    </svg>
    CopyMe
  </span>
  <span class="status" id="status" hidden><i class="dot"></i><span id="statusText"></span></span>
  <button class="ghost" id="leaveBtn" hidden>Leave</button>
</header>

<main>
  <p class="error" id="error" hidden></p>

  <!-- pairing -->
  <section id="setup">
    <input class="input" id="key" placeholder="Channel ID" autocomplete="off" spellcheck="false">
    <div class="buttons">
      <button class="btn primary" id="createBtn">Create Channel</button>
      <button class="btn" id="joinBtn">Join Channel</button>
    </div>
  </section>

  <!-- send / receive -->
  <section id="station" hidden>
    <textarea id="draft" placeholder="Text to send" spellcheck="false"></textarea>
    <button class="btn primary wide" id="sendBtn">Send</button>

    <hr>

    <button class="btn wide" id="receiveBtn">Refresh</button>
    <div class="out" id="out" hidden>
      <pre id="outText"></pre>
      <button class="btn" id="copyBtn">Copy</button>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>
<script type="module" src="app.js"></script>
</body>
</html>
